<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioBlade Viewer Embed</title>
  <style>
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
    body { width: 100%; }
  </style>
</head>
<body>
<!-- =====================================================================
  BioBlade 3D Viewer: einbettbares Element (nur Schwarz)
  Einfach diesen kompletten Block in deine Webseite kopieren.
  Video liegt im Ordner "bioblade-media/" neben dieser Datei
  (Pfade unten im CONFIG-Block anpassbar).
====================================================================== -->

<div class="bb-viewer" id="bbViewer">
  <div class="bb-stage">
    <video class="bb-vid" data-key="black" muted playsinline preload="auto"></video>
    <div class="bb-loading">Lade …</div>

    <!-- Steuerung im Frame (Frosted Glass) -->
    <div class="bb-controls">
      <div class="bb-slider" role="slider" tabindex="0" aria-label="Produkt drehen"
           aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
        <div class="bb-track"></div>
        <div class="bb-thumb"></div>
      </div>
    </div>
  </div>
</div>

<style>
  .bb-viewer{
    --bb-page:transparent;
    --bb-bg:transparent;
    --bb-accent:#fff;
    --bb-track:rgba(255,255,255,.22);
    --bb-glass:rgba(28,28,30,.45);
    width:100%; margin:0; padding:0; background:transparent; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:rgba(255,255,255,.6); user-select:none; -webkit-user-select:none;
  }
  .bb-viewer *{ box-sizing:border-box; }
  .bb-stage{
    position:relative; width:100%; max-width:none; margin:0; aspect-ratio:1/1;
    background:transparent; overflow:hidden; border-radius:0; box-shadow:none;
  }
  .bb-vid{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; opacity:0; pointer-events:none; }
  .bb-vid.bb-show{ opacity:1; }
  .bb-loading{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:14px; background:transparent; transition:opacity .3s; }
  .bb-loading.bb-hide{ opacity:0; pointer-events:none; }

  /* Frosted-Glass-Leiste im Frame (nur Slider) */
  .bb-controls{
    position:absolute; left:16px; right:16px; bottom:16px;
    display:flex; align-items:center; gap:20px; padding:10px 18px;
    background:var(--bb-glass);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    backdrop-filter:blur(24px) saturate(180%);
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    box-shadow:0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  }

  /* Eigener Slider (mit weichem Limit am Ende) */
  .bb-slider{ position:relative; flex:1; height:28px; cursor:grab; touch-action:none; outline:none; }
  .bb-slider.bb-grab{ cursor:grabbing; }
  .bb-slider.bb-disabled{ opacity:.4; pointer-events:none; }
  .bb-track{ position:absolute; left:0; right:0; top:50%; height:4px; margin-top:-2px; border-radius:2px; background:var(--bb-track); }
  .bb-thumb{
    position:absolute; top:50%; left:50%; width:24px; height:24px; margin:-12px 0 0 -12px;
    border-radius:50%; background:var(--bb-accent); box-shadow:0 2px 8px rgba(0,0,0,.4);
    will-change:transform;
  }
  .bb-slider:focus-visible .bb-thumb{ box-shadow:0 0 0 3px rgba(41,151,255,.5); }
</style>

<script>
(function(){
  /* =================== CONFIG =================== */
  var CONFIG = {
    folder: "bioblade-media/",
    files: {
      black: { src: "BioBlade Black0001-0060.mp4", frames: 60 }
    },
    snapMs: 380,         // Dauer des Zurückschnappens zur Mitte (0 = sofort)
    bounce: 0.9,         // Stärke des Bounce-Back beim Loslassen (0 = keiner, 0.9 = subtil, 1.7 = stark)
    leftWraps: true,     // links: 1 → 60 → 59 → … (gespiegelte Drehrichtung)
    softStart: 0.75,     // ab hier (0–1 des Wegs) wird der Slider zum Ende hin immer langsamer
    maxReach: 0.96,      // Grenzwert, dem er sich nähert, aber nie erreicht (0.96 ≈ Frame 58 von 60)
    smoothing: 0.28      // Nachlauf des Sliders (0.1 = sehr weich, 1 = direkt)
  };
  /* ============================================== */

  var root   = document.getElementById("bbViewer");
  var slider = root.querySelector(".bb-slider");
  var thumb  = root.querySelector(".bb-thumb");
  var loader = root.querySelector(".bb-loading");
  var vids   = {};
  root.querySelectorAll(".bb-vid").forEach(function(v){ vids[v.dataset.key] = v; });

  var THUMB = 24;
  var current = "black";
  var snapRAF = null, tickRAF = null;
  var dragging = false;
  var rRaw = 0;              // Roh-Position des Fingers/Cursors (-1 … 1)
  var sTarget = 0, sCur = 0; // Ziel- und aktuelle Position nach Soft-Limit

  /* ---------- Video-Setup ---------- */
  Object.keys(vids).forEach(function(k){
    var v = vids[k];
    v._seeking = false;
    v.src = CONFIG.folder + encodeURI(CONFIG.files[k].src);
    v.addEventListener("seeked", function(){
      v._seeking = false;
      if(v._pending !== undefined && Math.abs(v._pending - v.currentTime) > 1e-4){
        var t = v._pending; v._pending = undefined; seekRaw(v, t);
      }
    });
  });

  function seekRaw(v, t){ v._seeking = true; v.currentTime = t; }
  function seek(v, t){
    if(v._seeking){ v._pending = t; } else { seekRaw(v, t); }
  }
  function frameTime(key, f){            // f = 0-basiert
    var v = vids[key], n = CONFIG.files[key].frames;
    return Math.min(v.duration - 0.0005, (f + 0.5) / n * v.duration);
  }
  function seekAsync(v, t){
    return new Promise(function(res){
      function done(){ v.removeEventListener("seeked", done); res(); }
      v.addEventListener("seeked", done);
      v._pending = undefined; seekRaw(v, t);
    });
  }
  function show(key){
    Object.keys(vids).forEach(function(k){ vids[k].classList.toggle("bb-show", k === key); });
  }

  /* ---------- Soft-Limit ---------- */
  // Bis softStart linear, danach immer langsamer (exponentiell) in Richtung
  // maxReach. Der Zeiger darf über den Slider hinausgehen: der Slider läuft
  // dann weiter, aber nähert sich dem Grenzwert nur an und erreicht ihn nie.
  function soft(r){
    var a = Math.abs(r), T = CONFIG.softStart, L = CONFIG.maxReach, s;
    if(a <= T){ s = a; }
    else { s = T + (L - T) * (1 - Math.exp(-(a - T) / (L - T))); }
    return r < 0 ? -s : s;
  }

  /* ---------- Position → Frame ---------- */
  function half(){ return Math.max(1, (slider.clientWidth - THUMB) / 2); }
  function frameFor(p){                  // p: -1 … 1  →  Frame-Index 0 … N-1
    var n = CONFIG.files[current].frames;
    var o = p * (n - 1);
    if(o >= 0) return Math.round(o);
    return CONFIG.leftWraps ? (n - Math.round(-o)) % n : Math.round(-o);
  }
  function setS(s){
    sCur = s;
    thumb.style.transform = "translateX(" + (s * half()) + "px)";
    slider.setAttribute("aria-valuenow", s.toFixed(3));
    seek(vids[current], frameTime(current, frameFor(s)));
  }
  window.addEventListener("resize", function(){ setS(sCur); });

  /* ---------- Weiches Nachlaufen beim Ziehen ---------- */
  function tick(){
    tickRAF = null;
    sCur += (sTarget - sCur) * CONFIG.smoothing;
    if(Math.abs(sTarget - sCur) < 0.0004) sCur = sTarget;
    setS(sCur);
    if(dragging || sCur !== sTarget) tickRAF = requestAnimationFrame(tick);
  }
  function startTick(){ if(!tickRAF) tickRAF = requestAnimationFrame(tick); }
  function stopTick(){ cancelAnimationFrame(tickRAF); tickRAF = null; }

  function fromPointer(e){
    var rect = slider.getBoundingClientRect();
    var r = (e.clientX - (rect.left + rect.width / 2)) / half();
    rRaw = Math.max(-8, Math.min(8, r));   // Zeiger darf weit über den Slider hinaus
    sTarget = soft(rRaw);
  }
  slider.addEventListener("pointerdown", function(e){
    dragging = true;
    slider.classList.add("bb-grab");
    try{ slider.setPointerCapture(e.pointerId); }catch(_){}
    cancelAnimationFrame(snapRAF);
    fromPointer(e); startTick();
  });
  slider.addEventListener("pointermove", function(e){ if(dragging) fromPointer(e); });
  slider.addEventListener("pointerup", release);
  slider.addEventListener("pointercancel", release);

  slider.addEventListener("keydown", function(e){
    if(e.key === "ArrowRight" || e.key === "ArrowLeft"){
      e.preventDefault();
      cancelAnimationFrame(snapRAF);
      rRaw = Math.max(-1, Math.min(1, rRaw + (e.key === "ArrowRight" ? 0.04 : -0.04)));
      sTarget = soft(rRaw); startTick();
    }
  });
  slider.addEventListener("keyup", function(e){
    if(e.key === "ArrowRight" || e.key === "ArrowLeft") release();
  });

  /* ---------- Zurückschnappen ---------- */
  function snapToCenter(withBounce){
    return new Promise(function(res){
      cancelAnimationFrame(snapRAF); stopTick();
      rRaw = 0; sTarget = 0;
      var from = sCur;
      if(from === 0 || CONFIG.snapMs <= 0){ setS(0); return res(); }
      var c1 = CONFIG.bounce, c3 = c1 + 1;
      var t0 = performance.now();
      (function step(now){
        var k = Math.min(1, (now - t0) / CONFIG.snapMs);
        var e;
        if(withBounce && c1 > 0){                       // easeOutBack: kurzes, leichtes Überschwingen
          e = 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2);
        } else {
          e = 1 - Math.pow(1 - k, 3);
        }
        setS(from * (1 - e));
        if(k < 1) snapRAF = requestAnimationFrame(step);
        else { setS(0); res(); }
      })(t0);
    });
  }
  function release(){
    if(!dragging && sCur === 0) return;
    dragging = false;
    slider.classList.remove("bb-grab");
    snapToCenter(true);
  }

  /* ---------- Start ---------- */
  var v = vids[current];
  var ready = new Promise(function(res){
    if(v.readyState >= 1) return res();
    v.addEventListener("loadedmetadata", res, { once: true });
    v.addEventListener("error", function(){ loader.textContent = "Video nicht gefunden: " + CONFIG.files[current].src; }, { once: true });
  });
  ready.then(function(){
    return seekAsync(v, frameTime(current, 0));
  }).then(function(){
    show(current);
    loader.classList.add("bb-hide");
  });
})();
</script>

</body>
</html>
